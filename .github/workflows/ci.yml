name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: node scripts/assert-app.mjs
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:a11y
      - run: npm run test:a11y:scan
      - run: npm run build
      - run: npm run size